services:
  mediclaim-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mediclaim-adjudication

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      # Application data
      - ./data:/app/data

      # Local vector store
      - ./vectorstore:/app/vectorstore

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s