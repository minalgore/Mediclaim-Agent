name: MediClaim CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/minalgore/mediclaim-agent

jobs:

  # ============================================================
  # CI VALIDATION
  # ============================================================
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q app config main.py scripts tests

      - name: Validate required project files
        run: |
          test -f main.py
          test -f Dockerfile
          test -f requirements.txt
          test -f config/policy_rules.yaml

      - name: Validate application import
        env:
          PYTHONPATH: .
        run: |
          python -c "from main import app; print('FastAPI application import: OK')"

      - name: Run unit and functional tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q


  # ============================================================
  # DOCKER BUILD
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify image name
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME}"

      - name: Build Docker image
        run: |
          docker build \
            -t ${IMAGE_NAME}:sha-${GITHUB_SHA} \
            -t ${IMAGE_NAME}:latest \
            .

      - name: Verify Docker image exists
        run: |
          docker image inspect ${IMAGE_NAME}:sha-${GITHUB_SHA}


  # ============================================================
  # PUBLISH TO GITHUB CONTAINER REGISTRY
  # ============================================================
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest


  # ============================================================
  # CONTAINER VERIFICATION
  # ============================================================
  verify:
    name: Verify Container
    runs-on: ubuntu-latest

    needs:
      - publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: |
          docker pull ${IMAGE_NAME}:sha-${GITHUB_SHA}

      - name: Start container
        run: |
          docker run \
            -d \
            --name mediclaim-test \
            -p 8000:8000 \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            -e LANGCHAIN_API_KEY="${LANGCHAIN_API_KEY}" \
            -e LANGCHAIN_PROJECT="${LANGCHAIN_PROJECT}" \
            -e REDIS_HOST="${REDIS_HOST}" \
            -e REDIS_PORT="${REDIS_PORT}" \
            ${IMAGE_NAME}:sha-${GITHUB_SHA}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ vars.LANGCHAIN_PROJECT }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}

      - name: Wait for application startup
        run: |
          sleep 10

      - name: Verify application health
        run: |
          curl --fail http://127.0.0.1:8000/health

      - name: Show container logs
        if: always()
        run: |
          docker logs mediclaim-test

      - name: Stop container
        if: always()
        run: |
          docker rm -f mediclaim-test || true